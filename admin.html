```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahalaxmi Xerox Admin</title>

    <link rel="stylesheet" href="admin.css">
</head>

<body>

<div class="container">

    <header class="header">

        <div>
            <h1>🖨 Mahalaxmi Xerox Admin</h1>
            <p>Manage Orders & Printing</p>
        </div>

        <div class="header-buttons">

            <button id="refreshBtn">
                🔄 Refresh
            </button>

            <button id="logoutBtn">
                🚪 Logout
            </button>

        </div>

    </header>


    <section class="dashboard">

        <div class="card">
            <h3>Total Orders</h3>
            <h2 id="totalOrders">0</h2>
        </div>

        <div class="card">
            <h3>Pending</h3>
            <h2 id="pendingOrders">0</h2>
        </div>

        <div class="card">
            <h3>Printed</h3>
            <h2 id="printedOrders">0</h2>
        </div>

        <div class="card">
            <h3>Total Income</h3>
            <h2 id="totalIncome">₹0</h2>
        </div>

    </section>


    <div class="search-box">

        <input
            type="text"
            id="searchBox"
            placeholder="🔍 Search File Name">

    </div>


    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>File</th>

                    <th>Service</th>

                    <th>Print Type</th>

                    <th>Pages</th>

                    <th>Copies</th>

                    <th>Amount</th>

                    <th>Status</th>

                    <th>Action</th>

                </tr>

            </thead>

            <tbody id="ordersTable">

            </tbody>

        </table>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="admin.js"></script>

</body>

</html>
```
