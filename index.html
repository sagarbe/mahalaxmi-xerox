<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mahalaxmi Xerox Centre & General Store</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1>🏪 Mahalaxmi Xerox Centre & General Store</h1>

<p>Online Print Service</p>

<hr>

<label><b>Select Service</b></label>

<select id="service">

<option value="document">📄 Document Print</option>

<option value="aadhaar">🪪 Aadhaar Card Print</option>

<option value="pan">💳 PAN Card Print</option>

<option value="passport">🖼 Passport Photo</option>

<option value="photo">📸 Photo Print</option>

</select>

<br><br>

<label><b>Upload Document</b></label>

<input type="file" id="file">

<br><br>

<label><b>Print Type</b></label>

<br>

<label>

<input type="radio" name="print" checked>

Black & White (₹5/Page)

</label>

<br>

<label>

<input type="radio" name="print">

Color (₹10/Page)

</label>

<br><br>

<label><b>Copies</b></label>

<input
type="number"
id="copies"
value="1"
min="1">

<br><br>

<h2>

Total :

<span id="totalPrice">

₹5

</span>

</h2>

<button>

Place Order

</button>

</div>

<script src="script.js"></script>

</body>
</html>
