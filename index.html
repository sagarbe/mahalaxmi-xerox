<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahalaxmi Xerox Centre & General Store</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="logo">🖨️</div>

    <h1>Mahalaxmi Xerox Centre & General Store</h1>

    <p class="subtitle">
        Upload your document and place your print order
    </p>

    <label><b>Select Service</b></label>

    <select id="service">

        <option value="document">📄 Document Print</option>

        <option value="aadhaar">🪪 Aadhaar Card Print</option>

        <option value="pan">💳 PAN Card Print</option>

        <option value="passport">📷 Passport Photo</option>

        <option value="photo">🖼 Photo Print (4x6)</option>

    </select>

    <label><b>Upload Document</b></label>

    <input type="file" id="file">

    <label><b>Print Type</b></label>

    <div class="radio">
        <label>
            <input type="radio" name="print" checked>
            Black & White (₹5/Page)
        </label>
    </div>

    <div class="radio">
        <label>
            <input type="radio" name="print">
            Color (₹10/Page)
        </label>
    </div>

    <label><b>Number of Copies</b></label>

    <input
        type="number"
        id="copies"
        value="1"
        min="1">
    <div class="file-info">

    <h3>Selected File</h3>
    
    <p id="fileName">
    No file selected
    </p>
    
    </div>

    <div class="total">
        Total :
        <span id="totalPrice">₹5</span>
    </div>
    <div class="summary">

    <p>
    Pages :
    <span id="pages">
    1
    </span>
    </p>
    
    <p>
    Rate :
    <span id="rate">
    ₹5
    </span>
    </p>
    
    </div>

    <button id="orderBtn">
        🖨️ Place Order
    </button>

</div>

<script src="script.js"></script>

</body>
</html>
